<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خريطة وادي فيران</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <style>
        /* إعدادات الصفحة لملء الشاشة */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* جعل الخريطة تأخذ كامل مساحة الشاشة */
        #map {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        // --- إعدادات الموقع ---
        // إحداثيات وادي فيران - جنوب سيناء
        var lat = 28.7185675; 
        var lng = 33.6184308;
        var zoomLevel = 13; // مستوى التقريب (مناسب لرؤية الوادي)

        // 1. إنشاء الخريطة
        var map = L.map('map').setView([lat, lng], zoomLevel);

        // 2. إضافة طبقة الخريطة (OpenStreetMap)
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        // 3. إضافة علامة (Marker) على وادي فيران
        var marker = L.marker([lat, lng]).addTo(map);

        // 4. إضافة نافذة منبثقة (Popup) عند الضغط على العلامة
        marker.bindPopup(`
            <div style="text-align: center;">
                <b>وادي فيران</b><br>
                لؤلؤة سيناء<br>
                أبو زنيمة، محافظة جنوب سيناء
            </div>
        `).openPopup(); // .openPopup() تجعل النافذة تفتح تلقائياً عند التحميل
    </script>

</body>
</html>
